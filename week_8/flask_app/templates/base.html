<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Electricity Demand Forecasting
        {% endblock %}
    </title>


    <!-- Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('dashboard') }}">

            <i class="bi bi-lightning-charge-fill"></i>

            Electricity Forecasting

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarMenu">

            <ul class="navbar-nav ms-auto">


                <!-- Dashboard -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('dashboard') }}">

                        <i class="bi bi-speedometer2"></i>

                        Dashboard

                    </a>

                </li>


                <!-- Forecast -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('forecast') }}">

                        <i class="bi bi-graph-up-arrow"></i>

                        Forecast

                    </a>

                </li>


                <!-- Analytics -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('analytics') }}">

                        <i class="bi bi-bar-chart-line"></i>

                        Analytics

                    </a>

                </li>


                <!-- Validation -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('validation') }}">

                        <i class="bi bi-check-circle"></i>

                        Validation

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="container-fluid py-4">

    {% block content %}

    {% endblock %}

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="bg-dark text-white text-center py-3 mt-5">

    <div>

        Electricity Demand Forecasting System

    </div>

    <small class="text-secondary">

        RNN-48 | 24-Hour Forecasting

    </small>

</footer>


<!-- Bootstrap JavaScript is only for Bootstrap's
     responsive navbar. No custom JavaScript is used. -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
