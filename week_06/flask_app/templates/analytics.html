{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center mb-4">Analytics Dashboard</h2>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header">
                    <h5>Correlation Heatmap</h5>
                </div>
                <div class="card-body">
                    <img src="{{ url_for('static', filename='plots/heatmap.png') }}" class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header">
                    <h5>Sale Price Distribution</h5>
                </div>
                <div class="card-body">
                    <img src="{{ url_for('static', filename='plots/distribution.png') }}" class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header">
                    <h5>Feature Importance</h5>
                </div>
                <div class="card-body">
                    <img src="{{ url_for('static', filename='plots/feature_importance.png') }}" class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header">
                    <h5>Actual vs Predicted</h5>
                </div>
                <div class="card-body">
                    <img src="{{ url_for('static', filename='plots/actual_vs_predicted.png') }}" class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-12 mb-4">
            <div class="card shadow">
                <div class="card-header">
                    <h5>Residual Analysis</h5>
                </div>
                <div class="card-body text-center">
                    <img src="{{ url_for('static', filename='plots/residual_plot.png') }}" class="img-fluid">
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
