<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Regression Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white p-3 vh-100" style="width: 250px; position: fixed;">

        <h3 class="text-center mb-4">
            House Price ML
        </h3>

        <ul class="nav flex-column">

            <li class="nav-item mb-2">
                <a href="/dashboard" class="nav-link text-white">
                    Dashboard
                </a>
            </li>

            <li class="nav-item mb-2">
                <a href="/prediction" class="nav-link text-white">
                    Prediction
                </a>
            </li>

            <li class="nav-item mb-2">
                <a href="/comparison" class="nav-link text-white">
                    Comparison
                </a>
            </li>

            <li class="nav-item mb-2">
                <a href="/analytics" class="nav-link text-white">
                    Analytics
                </a>
            </li>

            <li class="nav-item mb-2">
                <a href="/report" class="nav-link text-white">
                    Report
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->
    <div class="flex-grow-1" style="margin-left:250px;">

        <div class="container mt-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
